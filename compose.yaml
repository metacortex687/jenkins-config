services:
  jenkins:
    build:
      context: .

    image: jenkins-config:local
    container_name: jenkins
    restart: unless-stopped

    ports:
      - "127.0.0.1:${JENKINS_PORT}:8080"

    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_casc/jenkins.yaml
      JENKINS_JAVA_OPTS: -Djenkins.install.runSetupWizard=false

      JENKINS_ADMIN_ID: "${JENKINS_ADMIN_ID}"
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD}"
      JENKINS_ADMIN_EMAIL: "${JENKINS_ADMIN_EMAIL}"

      JENKINS_URL: "http://127.0.0.1:${JENKINS_PORT}/"

    volumes:
      - ./jenkins_home:/var/jenkins_home
      - ./casc:/var/jenkins_casc:ro
      - /var/run/docker.sock:/var/run/docker.sock

    group_add:
      - "${DOCKER_GID}"

    secrets:
      - github_ssh_key

secrets:
  github_ssh_key:
    file: ./secrets/github_ssh_key