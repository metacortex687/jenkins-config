stream_over_http_enabled: true

server:
  http_listen_port: 3200

query_frontend:
  search:
    max_duration: 720h
  metrics:
    max_duration: 720h
    
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

compactor:
  compaction:
    block_retention: 720h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  storage:
    path: /var/tempo/generator/wal

  traces_storage:
    path: /var/tempo/generator/traces

  processor:
    local_blocks:
      filter_server_spans: false
      flush_to_storage: true

overrides:
  defaults:
    metrics_generator:
      processors:
        - local-blocks

usage_report:
  reporting_enabled: false
